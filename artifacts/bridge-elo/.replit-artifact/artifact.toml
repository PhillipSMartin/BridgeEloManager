kind = "web"
previewPath = "/"
title = "Bridge ELO Tracker"
version = "1.0.0"
id = "artifacts/bridge-elo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21212

[services.development]
run = "pnpm --filter @workspace/bridge-elo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bridge-elo", "run", "build" ]
publicDir = "artifacts/bridge-elo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21212"
BASE_PATH = "/"
